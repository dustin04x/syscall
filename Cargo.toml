[workspace]
resolver = "2"
members = [
    "crates/syscall-core",
    "crates/syscall-storage",
    "crates/syscall-collector",
    "crates/syscall-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["SYSCALL contributors"]
description = "Linux process intelligence and runtime forensics"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libbpf-cargo = "0.27"
libbpf-rs = "0.27"
libc = "0.2"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
